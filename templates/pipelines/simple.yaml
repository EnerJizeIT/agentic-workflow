name: "simple"
description: "Supervisor plans, Worker implements, Supervisor verifies"

stages:
  - name: "plan"
    role: "supervisor"
    action: "create_todo"
    description: "Supervisor studies the plan and creates a TODO"

  - name: "implement"
    role: "worker"
    action: "execute_todo"
    description: "Worker executes the TODO"
    on_blocked: "escalate"
    max_retries: 3

  - name: "verify"
    role: "supervisor"
    action: "verify_result"
    description: "Supervisor verifies the result"
    on_approved: "commit_and_next"
    on_rejected: "replan"

# Agentic Workflow — Project Configuration
# Generated by `awf init`

###############################################################################
# PROJECT
###############################################################################
project:
  name: "<project-name>"
  root: "."

###############################################################################
# AGENT MODELS
# Each role can use its own model.
###############################################################################
models:
  supervisor:
    description: "Current session model"

  worker:
    agent_name: "worker"
    model: "vllm/llm"
    temperature: 0.1

  reviewer:
    agent_name: "reviewer"
    model: "vllm/llm"
    temperature: 0.1

  tester:
    agent_name: "tester"
    model: "vllm/llm"
    temperature: 0.1

###############################################################################
# VERIFICATION COMMANDS
# Commands used to verify code quality. Leave empty if not applicable.
###############################################################################
verification:
  test_cmd: ""                  # e.g. "pytest tests/"
  lint_cmd: ""                  # e.g. "ruff check ."
  typecheck_cmd: ""             # e.g. "mypy src/"
  build_cmd: ""                 # e.g. "docker compose config"
  coverage_cmd: ""              # e.g. "pytest --cov=src tests/"

###############################################################################
# PHASES
# Implementation plan files live in .agentic/phases/
###############################################################################
phases:
  current: ".agentic/phases/plan.md"

###############################################################################
# PIPELINE
# Default pipeline for `awf start`
###############################################################################
default_pipeline: "default"

###############################################################################
# RETRY POLICY
###############################################################################
retry:
  max_attempts: 3
  backoff_seconds: 0

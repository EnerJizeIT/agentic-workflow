[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awf"
version = "0.4.0"
description = "Agentic Workflow Framework — declarative multi-agent pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EnerJize" }]
dependencies = [
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "markdown>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
]

[tool.setuptools.packages.find]
include = ["awf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# KAUD-10: per-test timeout prevents hanging CI
timeout = 120
timeout_method = "signal"

[tool.ruff]
line-length = 100
target-version = "py39"  # awf-core requires >=3.9; plugin requires >=3.10 (separate dist)

[tool.ruff.lint]
# F: pyflakes (real bugs)
# E/W: pycodestyle (PEP 8)
# I: isort (import sorting)
# UP: pyupgrade (modernize syntax)
select = ["F", "E", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "F841",  # unused local variables (test fixtures often have them)
    "E501",  # long lines common in test data
    "E702",  # semicolons used in compact setup helpers (e.g. create(); activate())
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awf"
version = "1.0.0"
description = "Agentic Workflow Framework — declarative multi-agent pipeline orchestrator for opencode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EnerJize" }]
keywords = ["opencode", "mcp", "ai-agent", "pipeline", "multi-agent", "orchestrator", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "markdown>=3.4",
]

[project.urls]
Homepage = "https://github.com/EnerJizeIT/agentic-workflow"
Repository = "https://github.com/EnerJizeIT/agentic-workflow"
Issues = "https://github.com/EnerJizeIT/agentic-workflow/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["awf*"]

[tool.setuptools.package-data]
awf = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# KAUD-10: per-test timeout prevents hanging CI
timeout = 120
timeout_method = "signal"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F: pyflakes (real bugs)
# E/W: pycodestyle (PEP 8)
# I: isort (import sorting)
# UP: pyupgrade (modernize syntax)
select = ["F", "E", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "F841",  # unused local variables (test fixtures often have them)
    "E501",  # long lines common in test data
    "E702",  # semicolons used in compact setup helpers (e.g. create(); activate())
]

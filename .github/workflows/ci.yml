name: ci

# U7a: внешний судья на каждый push/PR. Полный сьют + lint из чистого
# окружения (venv-симуляция локально — см. DONE-TODO-0016).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Node24: v4 ran on the deprecated Node 20 runtime (2026 deprecation
      # wave); v5 is the first Node-24 major (manifest: using: node24).
      - uses: actions/checkout@v5
        with:
          # instruction-gates проверяет «живые хэши» — ссылки на коммиты
          # в docs/contracts/*.md должны существовать в истории (shallow
          # clone ломает гейт: badf05e вне fetch-depth=1).
          fetch-depth: 0

      - name: Set up Python 3.12
        # Node24: v5 ran on Node 20; v6 is Node 24 (manifest verified).
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./agent_workflow_ui[dev]"

      - name: Quality gates
        # U2: единый прогон — контракты (docs/contracts/), храповики
        # (.ratchet-counters), бюджет инструкций и команды проекта
        # (pytest -n auto, ruff). Отдельные шаги тестов/линта убраны:
        # run-all уже покрывает их — без двойного прогона (+2,5 мин CI).
        run: bash scripts/run-all.sh

  # AUD13-02/03: editable install never validates package-data, so a
  # data file can silently drop out of the PyPI wheel. This job builds the
  # real wheels, asserts the key files are inside, and smoke-installs the
  # core wheel in a clean venv (import + CLI help + package-data test).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build both wheels + smoke install in clean venv
        # A-18: the plugin wheel (agent-workflow-ui) was built but never
        # installed, so a broken plugin wheel would stay green. wheel-smoke.sh
        # builds BOTH wheels, installs them into a throwaway venv, and proves
        # `awf --help`, `import awf.api` and `import agent_workflow_ui` with the
        # working tree kept out of sys.path. Replaces the old core-wheel-only
        # smoke step (that runtime package-data check is covered below by the
        # wheel-contents assertion on the same dist/ output).
        run: bash scripts/wheel-smoke.sh

      - name: Check wheel contents
        # AUD13-02/03: assert the key package-data files are inside each wheel
        # (reads the dist/ output written by the step above).
        run: |
          python -m zipfile -l dist/awf-*.whl | grep -E \
            'awf/data/role_zones\.yaml|awf/templates/roles/supervisor/phase-(init|verify)\.md|awf/templates/dashboard\.html\.j2'
          python -m zipfile -l dist/agent_workflow_ui-*.whl | grep -E \
            'render/default_templates/project-setup\.html\.j2|SKILL\.md'

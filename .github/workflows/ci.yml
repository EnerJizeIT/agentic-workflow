name: ci

# U7a: внешний судья на каждый push/PR. Полный сьют + lint из чистого
# окружения (venv-симуляция локально — см. DONE-TODO-0016).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./agent_workflow_ui[dev]"

      - name: Run all tests
        run: python3 -m pytest tests/ -q -n auto --timeout=300 -p no:cacheprovider

      - name: Ruff check
        run: ruff check .

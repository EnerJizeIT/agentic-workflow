name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check tests/ awf/ agent_workflow_ui/src/agent_workflow_ui/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./agent_workflow_ui[dev]"

      - name: Run all tests
        run: |
          python -m pytest tests/ -v

      - name: Plugin coverage gate (≥80%)
        # Combined awf+plugin coverage is misleading because pytest-cov doesn't
        # track subprocess execution in E2E tests (awf-core cmd_*.py modules).
        # Apply the gate only to the plugin, where unit tests are the norm.
        # Threshold lowered from 80% to 75% — awf_kill and new MCP tool wrappers
        # added uncovered error paths (catch-all Exception handlers).
        run: |
          python -m pytest tests/agent_workflow_ui/ \
            --cov=agent_workflow_ui \
            --cov-report=term-missing \
            --cov-fail-under=80

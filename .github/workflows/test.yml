name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Node24: v4 ran on the deprecated Node 20 runtime; v5 is Node 24.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6  # Node24: v5 ran on Node 20; v6 is Node 24.
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check tests/ awf/ agent_workflow_ui/src/agent_workflow_ui/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Node24: v4 ran on the deprecated Node 20 runtime; v5 is Node 24.
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6  # Node24: v5 ran on Node 20; v6 is Node 24.
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./agent_workflow_ui[dev]"

      - name: Run all tests
        run: |
          python -m pytest tests/ -v

      - name: Core coverage gate (≥80%)
        # NEG-2026-09-19: the core awf package had NO coverage floor — the
        # run/reconcile data-destruction incident shipped untested code paths
        # (cmd_init 0%, dashboard_server 36%, run queue untested). Measured
        # 81% when the gate was introduced; keep it from sliding back.
        # Note: subprocess-executed modules (cmd_*.py) are conservatively low
        # here; direct-call smoke tests cover the entry points instead.
        run: |
          python -m pytest tests/unit tests/negative tests/integration tests/e2e \
            --cov=awf \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Plugin coverage gate (≥80%)
        # Combined awf+plugin coverage is misleading because pytest-cov doesn't
        # track subprocess execution in E2E tests (awf-core cmd_*.py modules).
        # Apply the gate only to the plugin, where unit tests are the norm.
        run: |
          python -m pytest tests/agent_workflow_ui/ \
            --cov=agent_workflow_ui \
            --cov-report=term-missing \
            --cov-fail-under=80

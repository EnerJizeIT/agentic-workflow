# Настройка instruction-gates.sh (U2, quality-gates).
# Подключается как shell-скрипт.

# 1. Бюджет слов: файлы, которые агент читает в каждой сессии.
# Текущее значение на момент U2 (2026-09-20): 541 слов. Лимит чуть выше —
# рост без удаления не пройдёт.
INSTR_FILES="AGENTS.md docs/contracts/*.md"
# RUN11-2026-09-26 (TODO-0091): лимит поднят 600 -> 735 — контракт метрик
# (docs/contracts/metrics.md, 130 слов) фиксирует область отчёта
# (part.data, не session.directory), парсер ID (A-10) и стадийно-
# агностичные коммиты (A-17); текущее значение 729 слов. Прецедент
# ратчета: повышение с обоснованием, а не тихо.
INSTR_WORD_LIMIT=735

# 2. Переносимое ядро: выключено (AGENTS.md осознанно содержит имена
# проекта: guard, tripwire, разбор инцидента).
PORTABLE_FILE="AGENTS.md"
PROJECT_NAMES_FILE=""

# 3. Живые хэши: ссылки «commit <хэш>» должны существовать в истории.
HASH_FILES="docs/playbooks/*.md docs/contracts/*.md"

# 4. Бюджет доктрины (U9): .agentic/doctrine/*.md подключается к промптам
# всех ролей автоматически — каждый урок платится каждой сессией.
# Текущее значение на момент U9 (2026-09-21): 135 слов. Лимит чуть выше —
# рост без удаления не пройдёт.
DOCTRINE_DIR=".agentic/doctrine"
DOCTRINE_WORD_LIMIT=250

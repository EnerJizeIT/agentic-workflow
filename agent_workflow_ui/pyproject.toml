[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-ui"
version = "1.1.0"
description = "MCP plugin that gives opencode agents tools for visual interaction (HTML forms, dashboards) with users"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EnerJize" }]
keywords = ["opencode", "mcp", "ai-agent", "pipeline", "dashboard", "forms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # <2: server.py uses the v1 API (mcp.server.fastmcp.FastMCP); mcp 2.x
    # renamed FastMCP → MCPServer and breaks the import on fresh installs.
    "mcp>=1.0,<2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "awf>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/EnerJizeIT/agentic-workflow"
Repository = "https://github.com/EnerJizeIT/agentic-workflow"
Issues = "https://github.com/EnerJizeIT/agentic-workflow/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agent-workflow-ui = "agent_workflow_ui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_workflow_ui*"]

[tool.setuptools.package-data]
agent_workflow_ui = ["render/default_templates/*.j2", "SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F: pyflakes (real bugs)
# E/W: pycodestyle (PEP 8)
# I: isort (import sorting)
# UP: pyupgrade (modernize syntax)
select = ["F", "E", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "F841",  # unused local variables (test fixtures often have them)
    "E501",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-ui"
version = "0.1.0"
description = "MCP plugin that gives opencode agents tools for visual interaction (HTML forms, dashboards) with users"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EnerJize" }]
dependencies = [
    "mcp>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "awf>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agent-workflow-ui = "agent_workflow_ui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_workflow_ui*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F: pyflakes (real bugs)
# E/W: pycodestyle (PEP 8)
# I: isort (import sorting)
# UP: pyupgrade (modernize syntax)
select = ["F", "E", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "F841",  # unused local variables (test fixtures often have them)
    "E501",
]

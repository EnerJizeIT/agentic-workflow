# Tool map for the `awf brief` card (RUN4 #1, TODO-0051).
#
# One group per situation. Every tool of the registry — MCP tools of
# agent_workflow_ui + CLI subcommands — must appear in EXACTLY ONE entry
# (tests/unit/test_brief.py enforces both directions against the live
# registry; see awf.brief.tool_registry / map_coverage).
#
# Entry fields:
#   mcp:  MCP tool name (omit when the tool is CLI-only)
#   cli:  CLI subcommand (omit when the tool is MCP-only)
#   when: one short line — when to use it (keep it ≤7 words: the card
#         has a 900-word budget)
groups:
  - title: launch
    tools:
      - mcp: awf_start
        cli: start
        when: "start the pipeline for the active TODO"
      - mcp: awf_continue
        cli: continue
        when: "resume a dead pipeline; --ack for BLOCKED"
      - mcp: awf_retry_stage
        when: "kill + retry the salvage stage"
      - mcp: awf_kill
        when: "stop a stuck pipeline"
  - title: check
    tools:
      - mcp: awf_status
        cli: status
        when: "active TODOs, pipeline PID, last signal"
      - mcp: awf_current_step
        when: "phase + full phase prompt"
      - mcp: awf_load_supervisor_context
        when: "full bootstrap context, one call"
      - mcp: awf_wait_for_event
        when: "wait for the next event (runs)"
      - mcp: awf_pipelines
        cli: pipelines
        when: "list pipelines, mark the active one"
      - mcp: awf_check_model_config
        when: "role models vs providers, before start"
  - title: run
    tools:
      - mcp: awf_run_start
        when: "queue, budget, stop flags"
      - mcp: awf_run_status
        when: "position, budget left, stop reason"
      - mcp: awf_run_next
        when: "launch the next queue item"
      - mcp: awf_run_note
        when: "live status line for the owner"
      - mcp: awf_run_finish
        when: "close the run, write RUN-REPORT"
      - mcp: awf_approve
        cli: approve
        when: "approve after your probes (evidence, sha)"
      - mcp: awf_reject
        when: "reject at verify (REVIEW signal)"
  - title: hygiene
    tools:
      - mcp: awf_unblock
        cli: unblock
        when: "clear stale BLOCKED/ACK signals"
      - mcp: awf_todo_remove
        cli: todo-remove
        when: "remove a never-started TODO"
      - mcp: awf_todo_retire
        cli: todo-retire
        when: "retire a rejected TODO stuck active"
      - mcp: awf_todo_update
        cli: todo-update
        when: "reword a not-started TODO, keep the number"
      - mcp: awf_restore
        cli: restore
        when: "archived TODO back to the inbox"
      - mcp: awf_reset
        cli: reset
        when: "clean runtime data (confirm first)"
  - title: forms
    tools:
      - mcp: awf_open_project_setup_form
        when: "pipeline + team for a new project"
      - mcp: awf_open_increment_planning_form
        when: "owner picks the decomposition variant"
      - mcp: open_form
        when: "open an HTML form (template + data)"
      - mcp: read_submit
        when: "was the form submitted?"
      - mcp: cancel_form
        when: "cancel a pending form"
      - mcp: list_pending_forms
        when: "which forms are open"
      - mcp: list_templates
        when: "which form templates exist"
  - title: metrics
    tools:
      - mcp: awf_metrics
        cli: metrics
        when: "token/cost report of the program"
      - mcp: awf_feedback
        cli: feedback
        when: "awf friction becomes an owner report"
  - title: context
    tools:
      - mcp: awf_brief
        cli: brief
        when: "this card (new session / lost context)"
      - mcp: awf_dispatch_todo
        when: "TODO + baseline + .ready, one call"
      - mcp: awf_write_pipeline
        cli: pipeline-write
        when: "create a named pipeline file"
      - mcp: awf_init
        cli: init
        when: "create the .agentic/ skeleton"
      - mcp: awf_set_goal
        when: "store the session goal"
      - mcp: awf_confirm_normalized
        when: "confirm role normalization"
      - mcp: awf_add_role
        cli: add-role
        when: "create a role file"
      - mcp: awf_analyze_roles
        cli: analyze-roles
        when: "role zone overlaps"
      - mcp: awf_baseline
        cli: baseline
        when: "snapshot sha + tests"
      - mcp: awf_rollback
        cli: rollback
        when: "reset to the baseline sha"
      - mcp: awf_prove_red
        cli: prove-red
        when: "tests red on baseline, green now"
      - mcp: awf_verify_pack
        cli: verify-pack
        when: "deterministic verify report"
      - mcp: awf_report
        cli: report
        when: "statuses + diff + test log"
      - mcp: awf_open_pipeline_dashboard
        when: "open the live dashboard"
      - mcp: awf_tree_sha
        cli: tree-sha
        when: "tree fingerprint for --verified-sha"
      - cli: mutations
        when: "mutation smoke on a quiet tree"
      - cli: todo-draft
        when: "task skeleton from AUDIT-INDEX.md"

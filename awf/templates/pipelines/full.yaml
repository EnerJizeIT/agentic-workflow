name: full
stages:
- name: plan
  role: supervisor
  description: Supervisor studies the plan and creates the unit
- name: agent-implementer
  role: agent-implementer
  task: 'Implement the unit per its contract: minimal, in-pattern changes; evidence
    in DONE.'
  on_blocked: escalate
  on_rejected: escalate
  on_failed: escalate
  max_retries: 3
- name: agent-architect-review
  role: agent-architect-review
  write_check: readonly
  task: Review the diff for design drift, dead code and 'written next to' instead
    of correctly; findings with verdicts in DONE; findings only — do NOT edit
    code in this stage (the fix round applies the approved refactor).
  on_blocked: escalate
  on_rejected: escalate
  on_failed: escalate
  max_retries: 3
- name: agent-qa-review
  role: agent-qa-review
  write_check: readonly
  task: Hunt behavioral bugs in the unit's change; findings with evidence in
    DONE; findings only — do NOT add or edit code or tests in this stage (the
    fix round writes them).
  on_blocked: escalate
  on_rejected: escalate
  on_failed: escalate
  max_retries: 3
- name: checklist-close
  id: checklist-close
  role: agent-implementer
  session_key: agent-implementer
  task: 'Закрой ТОЛЬКО пункты `## Чек-лист завершения` с пробами (`missing`);
    `manual` вне scope, блок не править; не меняй скоуп и контракт; запусти
    `awf checklist check <todo>`; отчитайся пунктами.'
  skip_if: checklist_green
  # A67: НЕ readonly — closer правит TODO и дерево, а `skip_if` требует off.
  write_check: 'off'
- name: checklist-check
  id: checklist-check
  role: agent-qa-review
  session_key: agent-qa-review
  write_check: readonly
  task: 'Проверь ТОЛЬКО дифф checklist-close: изменённые им файлы и целевые
    тесты, без полного круга; находки — обычным `## REVIEW-фикс`.'
  skip_if: checklist_close_skipped
- name: agent-project-auditor
  role: agent-project-auditor
  write_check: readonly
  task: 'Wide project slice around the change: portability, cross-unit inconsistencies,
    rough edges; findings list required (empty is allowed with justification).'
  on_blocked: escalate
  on_rejected: escalate
  on_failed: escalate
  max_retries: 3
- name: verify
  role: supervisor
  write_check: readonly
  description: Supervisor verifies the result
  on_approved: commit_and_next
  on_rejected: replan
